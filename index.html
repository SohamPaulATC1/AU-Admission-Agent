<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senco AI Outbound Calling Dashboard</title>
    <meta name="description" content="AI-powered outbound calling dashboard for Senco Gold and Diamonds. Dispatch and monitor voice agent calls in real-time.">
    <link rel="icon" href="favicon.png?v=1" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8f8f6;
            --bg-secondary: #ffffff;
            --bg-soft: #f1f1ee;
            --senco-red: #8b0000;
            --senco-red-light: #b30000;
            --gold-primary: #d4af37;
            --gold-light: #efd177;
            --text-primary: #17171a;
            --text-secondary: #505158;
            --text-muted: #66686f;
            --glass-bg: rgba(255, 255, 255, 0.84);
            --glass-border: rgba(0, 0, 0, 0.12);
            --danger: #a20e0e;
            --success: #a6821f;
            --nav-height: 76px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Poppins", sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(circle at 10% 12%, rgba(139, 0, 0, 0.08), transparent 35%),
                radial-gradient(circle at 84% 16%, rgba(212, 175, 55, 0.13), transparent 32%),
                linear-gradient(160deg, var(--bg-primary), var(--bg-secondary) 62%, #fcfcfb);
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: -20%;
            pointer-events: none;
            z-index: -2;
        }

        body::before {
            background: conic-gradient(from 35deg,
                    rgba(139, 0, 0, 0.1),
                    rgba(255, 255, 255, 0.12),
                    rgba(212, 175, 55, 0.14),
                    rgba(255, 255, 255, 0.1),
                    rgba(139, 0, 0, 0.08));
            filter: blur(35px);
            animation: gradientShift 14s ease-in-out infinite alternate;
        }

        body::after {
            background-image:
                radial-gradient(circle at 14% 22%, rgba(212, 175, 55, 0.18) 0, rgba(212, 175, 55, 0) 26%),
                radial-gradient(circle at 82% 70%, rgba(139, 0, 0, 0.12) 0, rgba(139, 0, 0, 0) 28%),
                radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.03) 0, rgba(0, 0, 0, 0) 64%);
            animation: gradientDrift 18s linear infinite;
            z-index: -1;
        }

        .sparkles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(212, 175, 55, 0.2) 1px, transparent 1px),
                radial-gradient(circle, rgba(139, 0, 0, 0.12) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.08));
            animation: sparkleMove 40s linear infinite;
        }

        /* ─── Top Nav ─── */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.2rem;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.86);
            border-bottom: 1px solid rgba(139, 0, 0, 0.22);
            z-index: 30;
        }

        .brand { display: flex; align-items: center; line-height: 0; }
        .brand-logo { display: block; height: 46px; width: auto; object-fit: contain; }
        .top-nav .brand:last-child { margin-left: auto; }

        /* ─── Dashboard Grid ─── */
        .dashboard {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
            padding: calc(var(--nav-height) + 1.6rem) 1.8rem 1.8rem;
        }

        /* ─── Left: Live Feed ─── */
        .feed-zone {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 0;
        }

        .feed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .feed-header h2 {
            font-family: "Playfair Display", serif;
            font-size: 1.35rem;
            font-weight: 600;
        }

        .active-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border-radius: 999px;
            padding: 0.28rem 0.75rem;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #fff;
            background: linear-gradient(135deg, var(--senco-red), var(--gold-primary));
        }

        .active-badge::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #39ff66;
            box-shadow: 0 0 8px rgba(57, 255, 102, 0.7);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .feed-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding-right: 0.3rem;
            max-height: calc(100vh - var(--nav-height) - 5rem);
        }

        .feed-scroll::-webkit-scrollbar { width: 5px; }
        .feed-scroll::-webkit-scrollbar-track { background: transparent; }
        .feed-scroll::-webkit-scrollbar-thumb { background: rgba(139, 0, 0, 0.2); border-radius: 10px; }

        .feed-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px dashed rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            color: var(--text-muted);
            font-size: 0.92rem;
            text-align: center;
            padding: 2rem;
            line-height: 1.7;
        }

        /* ─── Call Card (in feed) ─── */
        .call-card-live {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 1rem 1.15rem;
            animation: fadeSlideIn 0.35s ease-out;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .call-card-live.active {
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.12);
        }

        .call-card-live.ended {
            opacity: 0.72;
        }

        .call-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
        }

        .call-card-name {
            font-weight: 600;
            font-size: 0.92rem;
        }

        .call-card-phone {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-variant-numeric: tabular-nums;
        }

        .call-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.32rem;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            border: 1px solid transparent;
            transition: all 0.25s ease;
        }

        .call-status-pill.queued {
            color: var(--text-secondary);
            border-color: rgba(0, 0, 0, 0.18);
            background: rgba(0, 0, 0, 0.04);
        }

        .call-status-pill.ringing {
            color: #9a6e00;
            border-color: rgba(212, 175, 55, 0.45);
            background: rgba(212, 175, 55, 0.12);
        }

        .call-status-pill.connected {
            color: #1a6b3a;
            border-color: rgba(39, 174, 96, 0.4);
            background: rgba(39, 174, 96, 0.1);
        }

        .call-status-pill.ended {
            color: #7d1212;
            border-color: rgba(139, 0, 0, 0.35);
            background: rgba(139, 0, 0, 0.08);
        }

        .call-status-pill.failed {
            color: #7d1212;
            border-color: rgba(139, 0, 0, 0.35);
            background: rgba(139, 0, 0, 0.08);
        }

        /* ─── Timeline ─── */
        .call-timeline {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding-left: 0.15rem;
        }

        .timeline-event {
            display: flex;
            align-items: flex-start;
            gap: 0.55rem;
            position: relative;
            padding: 0.25rem 0;
            animation: fadeSlideIn 0.25s ease-out;
        }

        .timeline-event:not(:last-child)::before {
            content: "";
            position: absolute;
            left: 5px;
            top: 18px;
            bottom: -2px;
            width: 1px;
            background: rgba(0, 0, 0, 0.1);
        }

        .timeline-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 3px;
            border: 2px solid;
        }

        .timeline-dot.queued { border-color: #aaa; background: #ddd; }
        .timeline-dot.ringing { border-color: #c9a227; background: #efd177; animation: pulse-dot 1.2s ease-in-out infinite; }
        .timeline-dot.connected { border-color: #27ae60; background: #6edd9a; }
        .timeline-dot.user { border-color: #6c5ce7; background: #a29bfe; }
        .timeline-dot.ai { border-color: #0984e3; background: #74b9ff; }
        .timeline-dot.tool { border-color: #e17055; background: #fab1a0; }
        .timeline-dot.transfer { border-color: #fdcb6e; background: #ffeaa7; }
        .timeline-dot.ended { border-color: #8b0000; background: #c0392b; }
        .timeline-dot.failed { border-color: #8b0000; background: #c0392b; }
        .timeline-dot.transcript { border-color: #636e72; background: #b2bec3; }

        .timeline-text {
            font-size: 0.77rem;
            line-height: 1.4;
            color: var(--text-secondary);
        }

        .timeline-text .time {
            color: var(--text-muted);
            font-size: 0.68rem;
            margin-left: 0.35rem;
        }

        .timeline-text .transcript-quote {
            display: block;
            margin-top: 0.15rem;
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.73rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ─── Right: Form Card ─── */
        .form-zone {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0.6rem;
        }

        .call-card {
            width: min(100%, 490px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.16);
            padding: 1.8rem;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .call-card:hover {
            box-shadow: 0 24px 54px rgba(0, 0, 0, 0.2);
        }

        .card-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border-radius: 999px;
            border: 1px solid rgba(139, 0, 0, 0.45);
            color: #fff2de;
            background: linear-gradient(135deg, #8B0000, #D4AF37);
            font-size: 0.74rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.3rem 0.72rem;
        }

        .card-tag::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #39ff66;
            box-shadow: 0 0 10px rgba(57, 255, 102, 0.78);
        }

        .call-card h2 {
            margin: 1rem 0 0.4rem;
            font-family: "Playfair Display", serif;
            font-size: clamp(1.6rem, 2.2vw, 2.2rem);
            line-height: 1.2;
        }

        .call-card .subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.94rem;
            line-height: 1.7;
        }

        .call-form {
            margin-top: 1.45rem;
            display: grid;
            gap: 1.05rem;
        }

        .field { position: relative; }

        .field input {
            width: 100%;
            border: 1px solid rgba(0, 0, 0, 0.14);
            background: #ffffff;
            color: var(--text-primary);
            border-radius: 12px;
            height: 56px;
            padding: 0 0.95rem;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .field input::placeholder { color: transparent; }

        .field label {
            position: absolute;
            top: 50%;
            left: 0.92rem;
            transform: translateY(-50%);
            color: rgba(176, 176, 176, 0.82);
            font-size: 0.89rem;
            pointer-events: none;
            transition: all 0.22s ease;
            background: transparent;
            padding: 0 0.2rem;
        }

        .field input:focus {
            border-color: var(--senco-red-light);
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.14);
        }

        .field input:focus+label,
        .field input:not(:placeholder-shown)+label {
            top: 0;
            transform: translateY(-50%);
            font-size: 0.72rem;
            color: var(--senco-red-light);
            background: #ffffff;
        }

        .error-line {
            min-height: 18px;
            margin-top: 0.35rem;
            font-size: 0.76rem;
            color: var(--danger);
        }

        .action-row { display: grid; gap: 0.7rem; }

        .call-btn {
            position: relative;
            overflow: hidden;
            border: none;
            border-radius: 14px;
            padding: 0.95rem 1rem;
            color: #fff7ef;
            font-weight: 600;
            font-size: 0.96rem;
            font-family: inherit;
            background: linear-gradient(135deg, #8b0000, #b30000);
            background-size: 220% 220%;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.62rem;
            transition: transform 0.2s ease, filter 0.25s ease;
        }

        .call-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -160%;
            width: 70%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.52), transparent);
            transition: left 0.6s ease;
        }

        .call-btn:hover { transform: translateY(-1px) scale(1.01); filter: brightness(1.03); }
        .call-btn:hover::before { left: 170%; }
        .call-btn:active { transform: scale(0.985); }
        .call-btn:disabled { cursor: not-allowed; filter: grayscale(0.12) brightness(0.86); transform: none; }

        .spinner, .checkmark { display: none; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 243, 227, 0.35);
            border-top-color: rgba(255, 243, 227, 0.95);
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }

        .call-btn.state-loading .spinner { display: inline-flex; }
        .call-btn.state-loading .btn-text { display: none; }

        /* ─── SSE Connection Indicator ─── */
        .sse-status {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            font-size: 0.66rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.8);
            color: var(--text-muted);
            z-index: 20;
            transition: all 0.3s ease;
        }

        .sse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #aaa;
            transition: background 0.3s ease;
        }

        .sse-status.connected .sse-dot { background: #27ae60; box-shadow: 0 0 6px rgba(39,174,96,0.5); }
        .sse-status.error .sse-dot { background: #c0392b; }

        /* ─── Animations ─── */
        @keyframes gradientShift {
            0% { transform: translate3d(-2%, 0, 0) rotate(0deg); }
            100% { transform: translate3d(2%, -1.5%, 0) rotate(7deg); }
        }

        @keyframes gradientDrift {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(-2.5%, 1.2%, 0) scale(1.03); }
            100% { transform: translate3d(0, 0, 0) scale(1); }
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes sparkleMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(-40px); }
        }

        @keyframes fadeSlideIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.7; }
        }

        /* ─── Responsive ─── */
        @media (max-width: 1100px) {
            .dashboard {
                grid-template-columns: 1fr;
                gap: 1.2rem;
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }

            .form-zone { order: -1; }

            .call-card { width: 100%; max-width: 640px; }

            .feed-scroll { max-height: 50vh; }
        }

        @media (max-width: 760px) {
            :root { --nav-height: 68px; }
            .top-nav { padding: 0 0.85rem; }
            .brand-logo { height: 38px; }
            .call-card { padding: 1.15rem; border-radius: 16px; }
        }

        @media (max-width: 520px) {
            .dashboard { padding-left: 0.9rem; padding-right: 0.9rem; }
            .call-btn { width: 100%; }
        }
    </style>
</head>

<body>
    <div class="sparkles"></div>

    <nav class="top-nav">
        <div class="brand">
            <img src="/senco.png" alt="Senco Gold and Diamonds" class="brand-logo">
        </div>
        <div class="brand">
            <img src="/atc.png" alt="Adamas Tech" class="brand-logo">
        </div>
    </nav>

    <main class="dashboard">
        <!-- Left: Live Call Feed -->
        <section class="feed-zone">
            <div class="feed-header">
                <h2>Live Call Feed</h2>
                <span class="active-badge" id="activeBadge" style="display: none;">
                    <span id="activeCount">0</span> Active
                </span>
            </div>
            <div class="feed-scroll" id="feedScroll">
                <div class="feed-empty" id="feedEmpty">
                    <div>
                        <div style="font-size: 2rem; margin-bottom: 0.5rem;">📞</div>
                        <div>No calls dispatched yet.<br>Use the form to start an AI-assisted call.</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right: Dispatch Form -->
        <section class="form-zone">
            <div class="call-card" id="callCard">
                <span class="card-tag">Outbound Calling Assistant</span>
                <h2>Start AI-Assisted Call</h2>
                <p class="subtitle">Call customers with an AI voice agent. Monitor live events in real-time.</p>

                <form class="call-form" id="callForm" novalidate>
                    <div class="field">
                        <input id="userName" name="userName" type="text" placeholder=" " autocomplete="name" required>
                        <label for="userName">Customer Name</label>
                        <div class="error-line" id="nameError"></div>
                    </div>

                    <div class="field">
                        <input id="phoneNumber" name="phoneNumber" type="tel" placeholder=" " inputmode="numeric"
                            autocomplete="tel" required>
                        <label for="phoneNumber">Phone Number</label>
                        <div class="error-line" id="phoneError"></div>
                    </div>

                    <div class="action-row">
                        <button class="call-btn state-idle" id="callBtn" type="submit">
                            <span class="btn-text">DISPATCH AGENT</span>
                            <span class="spinner" aria-hidden="true"></span>
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- SSE Connection Indicator -->
    <div class="sse-status" id="sseStatus">
        <span class="sse-dot"></span>
        <span id="sseLabel">Connecting…</span>
    </div>

    <script>
        // ─── State ───
        const activeCalls = new Map();   // call_id → { name, phone, element, status, startTime }
        let activeCount = 0;

        // ─── DOM Refs ───
        const callForm = document.getElementById("callForm");
        const callBtn = document.getElementById("callBtn");
        const btnText = callBtn.querySelector(".btn-text");
        const userNameInput = document.getElementById("userName");
        const phoneInput = document.getElementById("phoneNumber");
        const nameError = document.getElementById("nameError");
        const phoneError = document.getElementById("phoneError");
        const feedScroll = document.getElementById("feedScroll");
        const feedEmpty = document.getElementById("feedEmpty");
        const activeBadge = document.getElementById("activeBadge");
        const activeCountEl = document.getElementById("activeCount");
        const sseStatus = document.getElementById("sseStatus");
        const sseLabel = document.getElementById("sseLabel");

        // ─── Helpers ───
        function cleanPhone(value) {
            const digits = value.replace(/\D/g, "");
            return digits.slice(-10);
        }

        function formatPhoneInput(value) {
            const digits = cleanPhone(value);
            if (digits.length <= 5) return digits;
            return `${digits.slice(0, 5)} ${digits.slice(5)}`;
        }

        function formatPhone(digits) {
            if (digits.length === 10) return `${digits.slice(0, 5)} ${digits.slice(5)}`;
            return digits;
        }

        phoneInput.addEventListener("input", () => {
            phoneInput.value = formatPhoneInput(phoneInput.value);
            phoneError.textContent = "";
        });

        userNameInput.addEventListener("input", () => { nameError.textContent = ""; });

        function validateInputs() {
            const userName = userNameInput.value.trim();
            const rawDigits = phoneInput.value.replace(/\D/g, "");
            const digits = rawDigits.length > 10 ? rawDigits.slice(-10) : rawDigits;
            let valid = true;

            nameError.textContent = "";
            phoneError.textContent = "";

            if (!userName) { nameError.textContent = "Please enter customer name."; valid = false; }
            if (!/^\d{10}$/.test(digits)) { phoneError.textContent = "Enter a valid 10-digit phone number."; valid = false; }
            else { phoneInput.value = formatPhoneInput(digits); }

            return { valid, userName, phoneDigits: digits };
        }

        function updateActiveCount() {
            activeCount = 0;
            activeCalls.forEach(c => { if (c.status !== "ended" && c.status !== "failed") activeCount++; });
            activeCountEl.textContent = activeCount;
            activeBadge.style.display = activeCount > 0 ? "inline-flex" : "none";
        }

        // ─── Event Icons & Labels ───
        const EVENT_CONFIG = {
            call_queued:     { icon: "📤", label: "Call queued",           dot: "queued" },
            call_failed:     { icon: "❌", label: "Call failed",           dot: "failed" },
            call_ringing:    { icon: "🔔", label: "Ringing…",             dot: "ringing" },
            call_connected:  { icon: "✅", label: "Connected — Live",     dot: "connected" },
            user_speaking:   { icon: "🎤", label: "User speaking",        dot: "user" },
            user_silent:     { icon: "🔇", label: "User stopped speaking",dot: "user" },
            ai_speaking:     { icon: "🤖", label: "AI responding",        dot: "ai" },
            ai_done:         { icon: "🤖", label: "AI finished speaking", dot: "ai" },
            tool_called:     { icon: "🔧", label: "Tool: ",               dot: "tool" },
            transfer_started:{ icon: "🔀", label: "Transferring to human",dot: "transfer" },
            call_ended:      { icon: "📴", label: "Call ended",            dot: "ended" },
            user_transcript: { icon: "🗣️", label: "User said:",          dot: "transcript" },
            ai_transcript:   { icon: "💬", label: "AI said:",             dot: "transcript" },
        };

        // ─── Create Call Card ───
        function getOrCreateCallCard(callId, name, phone) {
            if (activeCalls.has(callId)) return activeCalls.get(callId);

            feedEmpty.style.display = "none";

            const card = document.createElement("div");
            card.className = "call-card-live active";
            card.id = `call-${callId}`;

            const displayPhone = formatPhone(phone || "");

            card.innerHTML = `
                <div class="call-card-header">
                    <div>
                        <span class="call-card-name">${escapeHtml(name || "Unknown")}</span>
                        <span class="call-card-phone">&nbsp;·&nbsp;${escapeHtml(displayPhone)}</span>
                    </div>
                    <span class="call-status-pill queued" id="pill-${callId}">Queued</span>
                </div>
                <div class="call-timeline" id="timeline-${callId}"></div>
            `;

            feedScroll.prepend(card);

            const callData = {
                name: name || "Unknown",
                phone: phone || "",
                element: card,
                status: "queued",
                startTime: Date.now(),
            };
            activeCalls.set(callId, callData);
            updateActiveCount();

            return callData;
        }

        function escapeHtml(str) {
            const d = document.createElement("div");
            d.textContent = str;
            return d.innerHTML;
        }

        // ─── Append Timeline Event ───
        function appendTimelineEvent(callId, eventType, data, timestamp) {
            const config = EVENT_CONFIG[eventType];
            if (!config) return;

            const timeline = document.getElementById(`timeline-${callId}`);
            if (!timeline) return;

            let label = config.label;
            let transcript = "";

            if (eventType === "tool_called" && data.tool_name) {
                label += data.tool_name;
            }
            if (eventType === "call_ended" && data.cost) {
                label += ` — ${data.cost}`;
                if (data.reason) label += ` — ${data.reason}`;
            }
            if (eventType === "call_failed" && data.error) {
                label += ` — ${data.error}`;
            }
            if (eventType === "user_transcript" || eventType === "ai_transcript") {
                transcript = data.text || "";
            }

            const ev = document.createElement("div");
            ev.className = "timeline-event";
            ev.innerHTML = `
                <span class="timeline-dot ${config.dot}"></span>
                <div class="timeline-text">
                    ${config.icon} ${escapeHtml(label)}
                    <span class="time">${timestamp || ""}</span>
                    ${transcript ? `<span class="transcript-quote">"${escapeHtml(transcript)}"</span>` : ""}
                </div>
            `;
            timeline.appendChild(ev);

            // Auto-scroll the feed if near bottom
            const scroll = feedScroll;
            const isNearBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 120;
            if (isNearBottom) {
                ev.scrollIntoView({ behavior: "smooth", block: "end" });
            }
        }

        // ─── Update Status Pill ───
        function updateStatusPill(callId, statusClass, label) {
            const pill = document.getElementById(`pill-${callId}`);
            if (!pill) return;
            pill.className = `call-status-pill ${statusClass}`;
            pill.textContent = label;
        }

        // ─── Handle SSE Event ───
        function handleCallEvent(event) {
            const callId = event.call_id;
            const type = event.type;
            const data = event.data || {};
            const timestamp = event.timestamp || "";

            // Ensure card exists (keyed by request_uuid for outbound)
            if (type === "call_queued" || type === "call_failed") {
                getOrCreateCallCard(callId || `tmp-${Date.now()}`, data.name, data.phone);
            }

            let callData = activeCalls.get(callId);
            let effectiveId = callId;

            if (!callData) {
                // If Plivo emits a true callUuid, try to match it with the queued card by phone number
                if (data.phone) {
                    const entry = [...activeCalls.entries()].find(([k, v]) => v.phone === data.phone);
                    if (entry) {
                        effectiveId = entry[0];
                        callData = entry[1];
                        // Link the true callId to this card for future events
                        activeCalls.set(callId, callData);
                    }
                }
                
                // Final fallback (for orphaned events)
                if (!callData) {
                    callData = activeCalls.get([...activeCalls.keys()].pop());
                    effectiveId = callData ? [...activeCalls.entries()].find(([k, v]) => v === callData)?.[0] : null;
                }
            }

            if (!effectiveId) return;

            appendTimelineEvent(effectiveId, type, data, timestamp);

            // Update status
            switch (type) {
                case "call_ringing":
                    callData.status = "ringing";
                    updateStatusPill(effectiveId, "ringing", "Ringing…");
                    break;
                case "call_connected":
                    callData.status = "connected";
                    updateStatusPill(effectiveId, "connected", "Connected");
                    break;
                case "user_speaking":
                    if (callData.status !== "ended") {
                        updateStatusPill(effectiveId, "connected", "User Speaking");
                    }
                    break;
                case "ai_speaking":
                    if (callData.status !== "ended") {
                        updateStatusPill(effectiveId, "connected", "AI Speaking");
                    }
                    break;
                case "ai_done":
                case "user_silent":
                    if (callData.status !== "ended") {
                        updateStatusPill(effectiveId, "connected", "Connected");
                    }
                    break;
                case "transfer_started":
                    callData.status = "transfer";
                    updateStatusPill(effectiveId, "ringing", "Transferring");
                    break;
                case "call_ended":
                    callData.status = "ended";
                    updateStatusPill(effectiveId, "ended", "Ended");
                    callData.element.classList.remove("active");
                    callData.element.classList.add("ended");
                    break;
                case "call_failed":
                    callData.status = "failed";
                    updateStatusPill(effectiveId, "failed", "Failed");
                    callData.element.classList.remove("active");
                    callData.element.classList.add("ended");
                    break;
            }

            updateActiveCount();
        }

        // ─── SSE Connection ───
        function connectSSE() {
            const evtSource = new EventSource("/call-events");

            evtSource.onopen = () => {
                sseStatus.className = "sse-status connected";
                sseLabel.textContent = "Live";
            };

            evtSource.onmessage = (e) => {
                try {
                    const event = JSON.parse(e.data);
                    handleCallEvent(event);
                } catch (err) {
                    console.error("Failed to parse SSE event:", err);
                }
            };

            evtSource.onerror = () => {
                sseStatus.className = "sse-status error";
                sseLabel.textContent = "Reconnecting…";
            };

            return evtSource;
        }

        connectSSE();

        // ─── Form Submit ───
        async function triggerBackendCall(name, phoneDigits) {
            try {
                const response = await fetch("/trigger-call", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_name: name, phone_number: phoneDigits }),
                });

                let payload = {};
                try { payload = await response.json(); } catch (e) { payload = {}; }

                if (!response.ok) {
                    return { ok: false, message: payload.message || "Failed to queue call.", callId: null };
                }

                return { ok: true, message: payload.message || "Call queued.", callId: payload.call_uuid || null };
            } catch (error) {
                return { ok: false, message: "Network error.", callId: null };
            }
        }

        callForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const result = validateInputs();
            if (!result.valid) return;

            callBtn.classList.remove("state-idle");
            callBtn.classList.add("state-loading");
            callBtn.disabled = true;

            const backendResult = await triggerBackendCall(result.userName, result.phoneDigits);

            if (backendResult.ok && backendResult.callId) {
                // The SSE stream will deliver the call_queued event and create the card
                // But create it immediately as a fallback in case SSE hasn't connected yet
                getOrCreateCallCard(backendResult.callId, result.userName, result.phoneDigits);
            } else if (!backendResult.ok) {
                // Create a failed card directly
                const tmpId = `failed-${Date.now()}`;
                getOrCreateCallCard(tmpId, result.userName, result.phoneDigits);
                appendTimelineEvent(tmpId, "call_failed", { error: backendResult.message }, new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
                updateStatusPill(tmpId, "failed", "Failed");
                const callData = activeCalls.get(tmpId);
                if (callData) {
                    callData.status = "failed";
                    callData.element.classList.remove("active");
                    callData.element.classList.add("ended");
                }
                updateActiveCount();
            }

            callBtn.classList.remove("state-loading");
            callBtn.classList.add("state-idle");
            callBtn.disabled = false;

            // Clear form
            userNameInput.value = "";
            phoneInput.value = "";
        });

        // ─── 3D Tilt Effect ───
        const callCard = document.getElementById("callCard");
        callCard.addEventListener("mousemove", (event) => {
            if (window.innerWidth < 1040) return;
            const rect = callCard.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const rotateY = ((x / rect.width) - 0.5) * 6;
            const rotateX = -((y / rect.height) - 0.5) * 6;
            callCard.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        callCard.addEventListener("mouseleave", () => {
            callCard.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg)";
        });
    </script>
</body>
